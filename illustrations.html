  <!-- JAVASCRIPT -->
  <script>
    // Theme Toggle Functionality
    const themeToggle = document.querySelector('.theme-toggle');
    const themeIcon = themeToggle.querySelector('i');
    
    // Check for saved theme preference or default to light
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-theme');
      themeIcon.classList.remove('fa-moon');
      themeIcon.classList.add('fa-sun');
    }
    
    // Toggle theme function
    function toggleTheme() {
      document.body.classList.toggle('dark-theme');
      
      if (document.body.classList.contains('dark-theme')) {
        localStorage.setItem('theme', 'dark');
        themeIcon.classList.remove('fa-moon');
        themeIcon.classList.add('fa-sun');
      } else {
        localStorage.setItem('theme', 'light');
        themeIcon.classList.remove('fa-sun');
        themeIcon.classList.add('fa-moon');
      }
    }
    
    themeToggle.addEventListener('click', toggleTheme);
    
    // Smooth scrolling for anchor links
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function(e) {
        e.preventDefault();
        
        const targetId = this.getAttribute('href');
        if (targetId === '#') return;
        
        const targetElement = document.querySelector(targetId);
        if (targetElement) {
          window.scrollTo({
            top: targetElement.offsetTop - 80,
            behavior: 'smooth'
          });
        }
      });
    });

    // Brand Identity Slideshow Functionality
    document.addEventListener('DOMContentLoaded', function() {
      const slides = document.querySelectorAll('.slide');
      const prevBtn = document.querySelector('.prev-btn');
      const nextBtn = document.querySelector('.next-btn');
      const currentSlideEl = document.getElementById('current-slide');
      const totalSlidesEl = document.getElementById('total-slides');
      const slideshowDots = document.getElementById('slideshow-dots');
      const categoryBtns = document.querySelectorAll('.category-btn');
      
      let currentSlide = 0;
      let filteredSlides = Array.from(slides);
      let activeCategory = 'all';
      
      // Initialize slideshow
      function initSlideshow() {
        // Set total slides
        totalSlidesEl.textContent = filteredSlides.length;
        
        // Create dots - only show up to 10 dots for better UX
        slideshowDots.innerHTML = '';
        const maxDots = Math.min(filteredSlides.length, 10);
        for (let i = 0; i < maxDots; i++) {
          const dot = document.createElement('div');
          dot.classList.add('dot');
          if (i === currentSlide % maxDots) dot.classList.add('active');
          dot.addEventListener('click', () => {
            // Calculate which slide to go to based on dot index
            const slideIndex = Math.floor(currentSlide / maxDots) * maxDots + i;
            goToSlide(slideIndex % filteredSlides.length);
          });
          slideshowDots.appendChild(dot);
        }
        
        updateSlideshow();
      }
      
      // Update slideshow display
      function updateSlideshow() {
        // Hide all slides
        slides.forEach(slide => {
          slide.classList.remove('active');
        });
        
        // Show current slide
        if (filteredSlides[currentSlide]) {
          filteredSlides[currentSlide].classList.add('active');
        }
        
        // Update current slide counter
        currentSlideEl.textContent = currentSlide + 1;
        
        // Update dots
        const maxDots = Math.min(filteredSlides.length, 10);
        const dotIndex = currentSlide % maxDots;
        document.querySelectorAll('.dot').forEach((dot, index) => {
          if (index === dotIndex) {
            dot.classList.add('active');
          } else {
            dot.classList.remove('active');
          }
        });
      }
      
      // Go to specific slide
      function goToSlide(index) {
        if (index >= 0 && index < filteredSlides.length) {
          currentSlide = index;
          updateSlideshow();
        }
      }
      
      // Next slide
      function nextSlide() {
        if (currentSlide < filteredSlides.length - 1) {
          currentSlide++;
        } else {
          currentSlide = 0; // Loop back to first slide
        }
        updateSlideshow();
      }
      
      // Previous slide
      function prevSlide() {
        if (currentSlide > 0) {
          currentSlide--;
        } else {
          currentSlide = filteredSlides.length - 1; // Loop to last slide
        }
        updateSlideshow();
      }
      
      // Filter slides by category
      function filterSlides(category) {
        activeCategory = category;
        currentSlide = 0; // Reset to first slide
        
        if (category === 'all') {
          filteredSlides = Array.from(slides);
        } else {
          filteredSlides = Array.from(slides).filter(slide => 
            slide.getAttribute('data-category') === category
          );
        }
        
        // Update category buttons
        categoryBtns.forEach(btn => {
          if (btn.getAttribute('data-category') === category) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });
        
        initSlideshow();
      }
      
      // Event listeners
      prevBtn.addEventListener('click', prevSlide);
      nextBtn.addEventListener('click', nextSlide);
      
      // Category filter buttons
      categoryBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const category = btn.getAttribute('data-category');
          filterSlides(category);
        });
      });
      
      // Auto-advance slideshow every 5 seconds
      let slideshowInterval = setInterval(nextSlide, 5000);
      
      // Pause auto-advance on hover
      const slideshowContainer = document.getElementById('slideshow-container');
      slideshowContainer.addEventListener('mouseenter', () => {
        clearInterval(slideshowInterval);
      });
      
      slideshowContainer.addEventListener('mouseleave', () => {
        slideshowInterval = setInterval(nextSlide, 5000);
      });
      
      // Initialize slideshow
      initSlideshow();
    });

    // Fix for image loading issues
    window.addEventListener('load', function() {
      // Check if all images are loaded
      const images = document.querySelectorAll('img');
      let loadedCount = 0;
      
      images.forEach(img => {
        if (img.complete) {
          loadedCount++;
        } else {
          img.addEventListener('load', function() {
            loadedCount++;
          });
        }
      });
    });

    // Fix for navigation link
    const homeLink = document.querySelector('a[href="index.html"]');
    if (homeLink) {
      homeLink.addEventListener('click', function(e) {
        // You can add logic here if the index.html doesn't exist
        // For now, just let it navigate normally
        console.log('Navigating to home page');
      });
    }
  </script>
</body>
</html>
