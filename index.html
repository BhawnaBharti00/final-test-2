<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Book Now with Mailto & Scroll Nav</title>
<style>
  body {
    font-family: Arial, sans-serif;
    scroll-behavior: smooth;
    margin: 0; padding: 0;
  }
  nav {
    background: #333;
    padding: 10px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  nav a {
    color: #fff;
    margin-right: 20px;
    text-decoration: none;
    font-weight: bold;
  }
  nav a:hover {
    text-decoration: underline;
  }
  section {
    padding: 60px 20px;
    border-bottom: 1px solid #ddd;
  }
  h2 {
    margin-top: 0;
  }
  button {
    background-color: #e91e63;
    color: white;
    border: none;
    padding: 12px 24px;
    cursor: pointer;
    font-size: 16px;
    border-radius: 5px;
  }
  button:hover {
    background-color: #c2185b;
  }
  form {
    max-width: 400px;
  }
  label, textarea, input {
    display: block;
    width: 100%;
    margin-bottom: 10px;
  }
  textarea {
    resize: vertical;
  }
</style>
</head>
<body>

<nav>
  <a href="#services">Services</a>
  <a href="#feedback">Feedback</a>
  <a href="#book">Book Now</a>
</nav>

<section id="services">
  <h2>Services</h2>
  <p>Here are the services we offer...</p>
</section>

<section id="feedback">
  <h2>Feedback</h2>
  <form id="feedbackForm" onsubmit="event.preventDefault(); alert('Feedback submitted!');">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" placeholder="Your name" required />
    
    <label for="comments">Comments:</label>
    <textarea id="comments" name="comments" placeholder="Your feedback" rows="4" required></textarea>
    
    <button type="submit">Submit Feedback</button>
  </form>
</section>

<section id="book">
  <h2>Book Your Edit</h2>
  <button id="bookNowBtn">Book Now</button>
</section>

<script>
  document.getElementById('bookNowBtn').addEventListener('click', function() {
    const email = 'your.email@example.com';
    const subject = encodeURIComponent('Booking Request');
    const body = encodeURIComponent('Hello,\n\nI would like to book your editing services. Please let me know the next steps.\n\nThank you!');
    window.location.href = mailto:${email}?subject=${subject}&body=${body};
  });
</script>

</body>
</html>
