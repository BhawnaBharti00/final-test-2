<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upcoming Projects – Bhawna Creatives</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --lightpink: #ffe4e6;
      --rose: #fbcfe8;
      --hotpink: #db2777;
      --hotpink-hover: #be185d;
      --lavender: #f3e8ff;
      --white: #fff;
      --text-dark: #333;
      --text-muted: #666;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--lightpink);
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .container {
      background: var(--white);
      padding: 2.5rem;
      border-radius: 1.5rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      width: 100%;
      text-align: center;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      color: var(--hotpink);
      font-size: 2.2rem;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.1rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .emoji {
      font-size: 2rem;
      margin-bottom: 2rem;
    }

    a.back-home {
      display: inline-block;
      background: var(--hotpink);
      color: var(--white);
      padding: 0.7rem 1.6rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    a.back-home:hover {
      background: var(--hotpink-hover);
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.8rem;
      }
      p {
        font-size: 1rem;
      }
      .container {
        padding: 2rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎀 Thank You for Your Patience! 💖</h1>
    <p>We’re crafting something magical behind the scenes just for you.<br>
    Stay tuned for cozy animations, soft colors, and heartwarming stories. 🌸</p>
    <div class="emoji">⏳✨🎨</div>
    <a href="index.html" class="back-home">← Back to Home</a>
  </div>

</body>
</html>
